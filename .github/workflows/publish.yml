name: Publish update
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/publish.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified signed build
        run: |
          curl --fail --location 'https://sdmntprukwest.oaiusercontent.com/files/00000000-b6a4-8243-b6ec-b95d7a3bcbad/raw?se=2026-09-14T17%3A01%3A34Z&sp=r&sv=2026-02-06&sr=b&scid=01a0a0d3-7d88-7c85-aa25-7ed28bce01bb&skoid=c30e7ce7-1f51-4051-a377-288cdba21c02&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T09%3A20%3A05Z&ske=2026-09-15T09%3A20%3A05Z&sks=b&skv=2026-02-06&sig=VORpHSsSf%2Bw4FDBpxjc8JEO6LmMIUXg6A7lIZN1oTIo%3D' --output build.zip
          echo '3be24990c466864ec072aff7bc5508d95cc80f58abaa5eb23d9d2eb3b130daa6  build.zip' | sha256sum --check -
          unzip -o build.zip
          mv app-release.apk sempY-TV.apk
      - name: Verify private playlist is absent
        run: |
          if strings sempY-TV.apk | grep -Eq '14389bc4798d|936ec2885478a2564d1065c84f8532c5|fluxeras'; then
            echo 'Private playlist data found in APK'
            exit 1
          fi
      - name: Create update manifest
        run: |
          HASH=$(sha256sum sempY-TV.apk | cut -d ' ' -f 1)
          printf '{\n  "versionCode": 12,\n  "versionName": "1.1.1",\n  "apkUrl": "https://raw.githubusercontent.com/semperthY/sempY-TV-Updates/main/sempY-TV.apk",\n  "sha256": "%s"\n}\n' "$HASH" > latest.json
      - name: Publish files
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add sempY-TV.apk latest.json
          git commit -m "publish: sempY TV 1.1.1"
          git push
