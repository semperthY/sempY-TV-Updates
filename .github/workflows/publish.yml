name: Publish update
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/publish.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified signed build
        run: |
          curl --fail --location 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-de60-8210-9e73-d029b3590f99/raw?se=2026-09-15T10%3A52%3A43Z&sp=r&sv=2026-02-06&sr=b&scid=01a0a49a-f730-76f0-8f27-1e75f5d549d1&skoid=6658dbdd-f305-4d30-8f6b-d62218202cb9&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T06%3A38%3A30Z&ske=2026-09-16T06%3A38%3A30Z&sks=b&skv=2026-02-06&sig=ZOw4kDoQBRjdAnAZNsp0UvLsL6Bl0UYZR3WRHWDBV78%3D' --output build.zip
          echo 'f028133e38b00e6749c9a96fec5833ebf91e9c27f56a20c9397179885eb2e23c  build.zip' | sha256sum --check -
          unzip -o build.zip
          mv app-release.apk sempY-TV.apk
      - name: Verify private playlist is absent
        run: |
          if strings sempY-TV.apk | grep -Eq '14389bc4798d|936ec2885478a2564d1065c84f8532c5|fluxeras'; then
            echo 'Private playlist data found in APK'
            exit 1
          fi
      - name: Create update manifest
        run: |
          HASH=$(sha256sum sempY-TV.apk | cut -d ' ' -f 1)
          printf '{\n  "versionCode": 18,\n  "versionName": "1.3.0",\n  "apkUrl": "https://raw.githubusercontent.com/semperthY/sempY-TV-Updates/main/sempY-TV.apk",\n  "sha256": "%s"\n}\n' "$HASH" > latest.json
      - name: Publish files
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add sempY-TV.apk latest.json
          git commit -m "publish: sempY TV 1.3.0"
          git push
