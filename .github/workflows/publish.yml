name: Publish update
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/publish.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified signed build
        run: |
          curl --fail --location 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-dad0-81f4-9da7-fda5a6d0202f/raw?se=2026-09-16T16%3A26%3A27Z&sp=r&sv=2026-02-06&sr=b&scid=01a0aafd-2592-7969-a3ab-65ed6a10f3fe&skoid=e32cbaad-a1eb-4299-9f16-1b364ab43781&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T09%3A25%3A42Z&ske=2026-09-17T09%3A25%3A42Z&sks=b&skv=2026-02-06&sig=%2B3To1pIQvRIOFUb/P7yrCKTrQkFazDWGed6LMFIx%2BPQ%3D' --output build.zip
          echo 'da978458e8fd83a037c1ea231ef061127c3d925e843537e57c68a425ec481029  build.zip' | sha256sum --check -
          unzip -o build.zip
          mv app-release.apk sempY-TV.apk
      - name: Verify private playlist is absent
        run: |
          if strings sempY-TV.apk | grep -Eq '14389bc4798d|936ec2885478a2564d1065c84f8532c5|fluxeras'; then
            echo 'Private playlist data found in APK'
            exit 1
          fi
      - name: Create update manifest
        run: |
          HASH=$(sha256sum sempY-TV.apk | cut -d ' ' -f 1)
          printf '{\n  "versionCode": 33,\n  "versionName": "1.7.2",\n  "apkUrl": "https://raw.githubusercontent.com/semperthY/sempY-TV-Updates/main/sempY-TV.apk",\n  "sha256": "%s"\n}\n' "$HASH" > latest.json
      - name: Publish files
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add sempY-TV.apk latest.json
          git commit -m "publish: sempY TV 1.7.2"
          git push
