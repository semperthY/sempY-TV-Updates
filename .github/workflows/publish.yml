name: Publish update
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/publish.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified signed build
        run: |
          curl --fail --location 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-6d9c-8246-8d82-a894dc9ab4c6/raw?se=2026-09-15T18%3A09%3A17Z&sp=r&sv=2026-02-06&sr=b&scid=01a0a63c-8d04-77cd-a20f-63474bf8c6df&skoid=e32cbaad-a1eb-4299-9f16-1b364ab43781&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T07%3A45%3A34Z&ske=2026-09-16T07%3A45%3A34Z&sks=b&skv=2026-02-06&sig=IwZih0hRwPepP7AzOpQFqPt5fZkOuoUmpty958Tmok4%3D' --output build.zip
          echo '82137b535b876aa0f73818c472218c77e59eaaaa4da537607b2df80f4e302600  build.zip' | sha256sum --check -
          unzip -o build.zip
          mv app-release.apk sempY-TV.apk
      - name: Verify private playlist is absent
        run: |
          if strings sempY-TV.apk | grep -Eq '14389bc4798d|936ec2885478a2564d1065c84f8532c5|fluxeras'; then
            echo 'Private playlist data found in APK'
            exit 1
          fi
      - name: Create update manifest
        run: |
          HASH=$(sha256sum sempY-TV.apk | cut -d ' ' -f 1)
          printf '{\n  "versionCode": 25,\n  "versionName": "1.4.5",\n  "apkUrl": "https://raw.githubusercontent.com/semperthY/sempY-TV-Updates/main/sempY-TV.apk",\n  "sha256": "%s"\n}\n' "$HASH" > latest.json
      - name: Publish files
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add sempY-TV.apk latest.json
          git commit -m "publish: sempY TV 1.4.5"
          git push
