name: Publish update
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/publish.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified signed build
        run: |
          curl --fail --location 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-9f58-81f4-8c70-6c4aba878c23/raw?se=2026-09-14T17%3A11%3A47Z&sp=r&sv=2026-02-06&sr=b&scid=01a0a0dc-1052-7a66-8b41-2233480e63a7&skoid=c30e7ce7-1f51-4051-a377-288cdba21c02&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T08%3A31%3A15Z&ske=2026-09-15T08%3A31%3A15Z&sks=b&skv=2026-02-06&sig=qSQS2EIZJ2DjyjOC8A5AcmfhE%2BQKyOLmgCBgrMrvWoE%3D' --output build.zip
          echo '6e0c2d16aebdc50b78bc71a65233f7cc12123966856ff69e45ec66d2cb97cf47  build.zip' | sha256sum --check -
          unzip -o build.zip
          mv app-release.apk sempY-TV.apk
      - name: Verify private playlist is absent
        run: |
          if strings sempY-TV.apk | grep -Eq '14389bc4798d|936ec2885478a2564d1065c84f8532c5|fluxeras'; then
            echo 'Private playlist data found in APK'
            exit 1
          fi
      - name: Create update manifest
        run: |
          HASH=$(sha256sum sempY-TV.apk | cut -d ' ' -f 1)
          printf '{\n  "versionCode": 13,\n  "versionName": "1.1.2",\n  "apkUrl": "https://raw.githubusercontent.com/semperthY/sempY-TV-Updates/main/sempY-TV.apk",\n  "sha256": "%s"\n}\n' "$HASH" > latest.json
      - name: Publish files
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add sempY-TV.apk latest.json
          git commit -m "publish: sempY TV 1.1.2"
          git push
