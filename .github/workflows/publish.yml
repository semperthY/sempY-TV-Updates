name: Publish update
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/publish.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified signed build
        run: |
          curl --fail --location 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-6594-8210-8386-4c7e531d92fd/raw?se=2026-09-15T20%3A47%3A44Z&sp=r&sv=2026-02-06&sr=b&scid=5b2710d3-3bcd-459c-917c-de8ea36e3203&skoid=e32cbaad-a1eb-4299-9f16-1b364ab43781&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T06%3A07%3A31Z&ske=2026-09-16T06%3A07%3A31Z&sks=b&skv=2026-02-06&sig=vLEUYwFGjvwdBcFOPR1qCqZ7Tf4vRv4BbBFW8TE7Z9w%3D' --output build.zip
          echo '1aafd469e137a7ad79bcde20ff0da43508e0651427baa214d41b5e3f64a584db  build.zip' | sha256sum --check -
          unzip -o build.zip
          mv app-release.apk sempY-TV.apk
      - name: Verify private playlist is absent
        run: |
          if strings sempY-TV.apk | grep -Eq '14389bc4798d|936ec2885478a2564d1065c84f8532c5|fluxeras'; then
            echo 'Private playlist data found in APK'
            exit 1
          fi
      - name: Create update manifest
        run: |
          HASH=$(sha256sum sempY-TV.apk | cut -d ' ' -f 1)
          printf '{\n  "versionCode": 30,\n  "versionName": "1.6.3",\n  "apkUrl": "https://raw.githubusercontent.com/semperthY/sempY-TV-Updates/main/sempY-TV.apk",\n  "sha256": "%s"\n}\n' "$HASH" > latest.json
      - name: Publish files
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add sempY-TV.apk latest.json
          git commit -m "publish: sempY TV 1.6.3"
          git push
