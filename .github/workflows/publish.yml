name: Publish update
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/publish.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified signed build
        run: |
          curl --fail --location 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-7ce4-8210-9cca-4a5c26b8ce99/raw?se=2026-09-15T19%3A47%3A56Z&sp=r&sv=2026-02-06&sr=b&scid=ddbdbafe-1bbb-4af3-9a43-5b391e7b9791&skoid=e32ccaad-a1eb-4299-9f16-1b364ab43781&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T07%3A04%3A30Z&ske=2026-09-16T07%3A04%3A30Z&sks=b&skv=2026-02-06&sig=q6LjMA0UkXDQ3NQ1zEesu0dKtHbIesRCHZCh6SckVZg%3D' --output build.zip
          echo '1ef1df58fc3ed7cd7753d2f02e92017da1493a294d9b9f4fba371b77e431efce  build.zip' | sha256sum --check -
          unzip -o build.zip
          mv app-release.apk sempY-TV.apk
      - name: Verify private playlist is absent
        run: |
          if strings sempY-TV.apk | grep -Eq '14389bc4798d|936ec2885478a2564d1065c84f8532c5|fluxeras'; then
            echo 'Private playlist data found in APK'
            exit 1
          fi
      - name: Create update manifest
        run: |
          HASH=$(sha256sum sempY-TV.apk | cut -d ' ' -f 1)
          printf '{\n  "versionCode": 27,\n  "versionName": "1.6.0",\n  "apkUrl": "https://raw.githubusercontent.com/semperthY/sempY-TV-Updates/main/sempY-TV.apk",\n  "sha256": "%s"\n}\n' "$HASH" > latest.json
      - name: Publish files
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add sempY-TV.apk latest.json
          git commit -m "publish: sempY TV 1.6.0"
          git push
