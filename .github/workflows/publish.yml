name: Publish update
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/publish.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified signed build
        run: |
          curl --fail --location 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-5974-81f4-9bac-ee8f86f3dc39/raw?se=2026-09-15T11%3A51%3A09Z&sp=r&sv=2026-02-06&sr=b&scid=01a0a4de-ae50-73dc-9386-e9f473cc100a&skoid=c30e7ce7-1f51-4051-a377-288cdba21c02&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T06%3A28%3A13Z&ske=2026-09-16T06%3A28%3A13Z&sks=b&skv=2026-02-06&sig=/AcNIAllG7G6E9TRbttC6aV0gaVzq2h1oIq9RxlUxSk%3D' --output build.zip
          echo '342e7a1458a44d518c2d432a5a274be299d356e7e8a0065f1afd042663e36aed  build.zip' | sha256sum --check -
          unzip -o build.zip
          mv app-release.apk sempY-TV.apk
      - name: Verify private playlist is absent
        run: |
          if strings sempY-TV.apk | grep -Eq '14389bc4798d|936ec2885478a2564d1065c84f8532c5|fluxeras'; then
            echo 'Private playlist data found in APK'
            exit 1
          fi
      - name: Create update manifest
        run: |
          HASH=$(sha256sum sempY-TV.apk | cut -d ' ' -f 1)
          printf '{\n  "versionCode": 19,\n  "versionName": "1.3.1",\n  "apkUrl": "https://raw.githubusercontent.com/semperthY/sempY-TV-Updates/main/sempY-TV.apk",\n  "sha256": "%s"\n}\n' "$HASH" > latest.json
      - name: Publish files
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add sempY-TV.apk latest.json
          git commit -m "publish: sempY TV 1.3.1"
          git push
