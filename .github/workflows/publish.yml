name: Publish update
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/publish.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified signed build
        run: |
          curl --fail --location 'https://sdmntprukwest.oaiusercontent.com/files/00000000-c6e8-8243-af2e-eee1235ea5f9/raw?se=2026-09-14T16%3A32%3A17Z&sp=r&sv=2026-02-06&sr=b&scid=01a0a0b9-3193-722e-bd4c-3f16a0a6c019&skoid=c30e7ce7-1f51-4051-a377-288cdba21c02&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T09%3A19%3A14Z&ske=2026-09-15T09%3A19%3A14Z&sks=b&skv=2026-02-06&sig=JKgg2bxChJQoS5EKWmKW15hdZoTuqx51vWgBv975fyQ%3D' --output build.zip
          echo 'f15079bb4921b9f988fdd44abe35bdba63ca2eef8535df7f688e4c6053f0cb1f  build.zip' | sha256sum --check -
          unzip -o build.zip
          mv app-release.apk sempY-TV.apk
      - name: Verify private playlist is absent
        run: |
          if strings sempY-TV.apk | grep -Eq '14389bc4798d|936ec2885478a2564d1065c84f8532c5|fluxeras'; then
            echo 'Private playlist data found in APK'
            exit 1
          fi
      - name: Create update manifest
        run: |
          HASH=$(sha256sum sempY-TV.apk | cut -d ' ' -f 1)
          printf '{\n  "versionCode": 10,\n  "versionName": "1.0.0",\n  "apkUrl": "https://raw.githubusercontent.com/semperthY/sempY-TV-Updates/main/sempY-TV.apk",\n  "sha256": "%s"\n}\n' "$HASH" > latest.json
      - name: Publish files
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add sempY-TV.apk latest.json
          git commit -m "publish: sempY TV 1.0.0"
          git push
