name: Publish update
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/publish.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified signed build
        run: |
          curl --fail --location 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-dd28-8210-baba-a2b4394edd56/raw?se=2026-09-15T18%3A55%3A24Z&sp=r&sv=2026-02-06&sr=b&scid=01a0a65c-1362-73e6-8987-3d724135c60f&skoid=e32cbaad-a1eb-4299-9f16-1b364ab43781&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T08%3A28%3A39Z&ske=2026-09-16T08%3A28%3A39Z&sks=b&skv=2026-02-06&sig=nQ4MLMLR%2B6VK30fXO2ct/23GSpen9/DGCggMQrgu6UA%3D' --output build.zip
          echo '568866656c7b1bf93e80c66defdc16abf2c22732eba024011f9a63082680b317  build.zip' | sha256sum --check -
          unzip -o build.zip
          mv app-release.apk sempY-TV.apk
      - name: Verify private playlist is absent
        run: |
          if strings sempY-TV.apk | grep -Eq '14389bc4798d|936ec2885478a2564d1065c84f8532c5|fluxeras'; then
            echo 'Private playlist data found in APK'
            exit 1
          fi
      - name: Create update manifest
        run: |
          HASH=$(sha256sum sempY-TV.apk | cut -d ' ' -f 1)
          printf '{\n  "versionCode": 26,\n  "versionName": "1.5.0",\n  "apkUrl": "https://raw.githubusercontent.com/semperthY/sempY-TV-Updates/main/sempY-TV.apk",\n  "sha256": "%s"\n}\n' "$HASH" > latest.json
      - name: Publish files
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add sempY-TV.apk latest.json
          git commit -m "publish: sempY TV 1.5.0"
          git push
