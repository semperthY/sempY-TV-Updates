name: Publish update
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/publish.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified signed build
        run: |
          curl --fail --location 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-70d8-81f4-a846-b01c13ca3c6d/raw?se=2026-09-15T17%3A17%3A34Z&sp=r&sv=2026-02-06&sr=b&scid=01a0a607-ff40-785e-b160-dae2b49879d8&skoid=6658dbdd-f305-4d30-8f6b-d62218202cb9&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T20%3A04%3A51Z&ske=2026-09-15T20%3A04%3A51Z&sks=b&skv=2026-02-06&sig=4BH2YPnNAYhgH3eREoQBgm%2Bvv43Ia3cpScDMNfTRdcY%3D' --output build.zip
          echo '4ca3b0285db293751d838e705914a3af5cf45fb821f984c59638cd762af97f3b  build.zip' | sha256sum --check -
          unzip -o build.zip
          mv app-release.apk sempY-TV.apk
      - name: Verify private playlist is absent
        run: |
          if strings sempY-TV.apk | grep -Eq '14389bc4798d|936ec2885478a2564d1065c84f8532c5|fluxeras'; then
            echo 'Private playlist data found in APK'
            exit 1
          fi
      - name: Create update manifest
        run: |
          HASH=$(sha256sum sempY-TV.apk | cut -d ' ' -f 1)
          printf '{\n  "versionCode": 22,\n  "versionName": "1.4.2",\n  "apkUrl": "https://raw.githubusercontent.com/semperthY/sempY-TV-Updates/main/sempY-TV.apk",\n  "sha256": "%s"\n}\n' "$HASH" > latest.json
      - name: Publish files
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add sempY-TV.apk latest.json
          git commit -m "publish: sempY TV 1.4.2"
          git push
