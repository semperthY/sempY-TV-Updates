name: Publish update
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/publish.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified build
        run: |
          curl --fail --location 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-bfdc-81f4-adb6-58d03c9655ca/raw?se=2026-09-14T10%3A31%3A03Z&sp=r&sv=2026-02-06&sr=b&scid=01a09f68-8818-776f-8e07-2d39f0e21a21&skoid=6658dbdd-f305-4d30-8f6b-d62218202cb9&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T06%3A02%3A01Z&ske=2026-09-15T06%3A02%3A01Z&sks=b&skv=2026-02-06&sig=Isf7eOOCo/ZKN1vutewmor18SXc8PBDfbsMiShwgUzg%3D' --output build.zip
          unzip -o build.zip
          mv app-debug.apk sempY-TV.apk
      - name: Verify private playlist is absent
        run: |
          if strings sempY-TV.apk | grep -Eq '14389bc4798d|936ec2885478a2564d1065c84f8532c5|fluxeras'; then
            echo 'Private playlist data found in APK'
            exit 1
          fi
      - name: Create update manifest
        run: |
          HASH=$(sha256sum sempY-TV.apk | cut -d ' ' -f 1)
          printf '{\n  "versionCode": 7,\n  "versionName": "0.7.0",\n  "apkUrl": "https://raw.githubusercontent.com/semperthY/sempY-TV-Updates/main/sempY-TV.apk",\n  "sha256": "%s"\n}\n' "$HASH" > latest.json
      - name: Publish files
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add sempY-TV.apk latest.json
          git commit -m "publish: sempY TV 0.7.0"
          git push
