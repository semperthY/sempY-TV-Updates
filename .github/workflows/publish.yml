name: Publish update
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/publish.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified signed build
        run: |
          curl --fail --location 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-7b24-81f4-a14d-3b6512ec4262/raw?se=2026-09-14T18%3A12%3A40Z&sp=r&sv=2026-02-06&sr=b&scid=01a0a111-96aa-7d41-8a8f-46314aa1687d&skoid=6658dbdd-f305-4d30-8f6b-d62218202cb9&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T06%3A02%3A01Z&ske=2026-09-15T06%3A02%3A01Z&sks=b&skv=2026-02-06&sig=bC1ypkwSo/8GmxKwPsdERMQ5w99Gh9ZVWa%2BpFNAR/Os%3D' --output build.zip
          echo 'd9190c19aa1e233c9591334eda875f9869cbe68c66689bf16315bca13304412a  build.zip' | sha256sum --check -
          unzip -o build.zip
          mv app-release.apk sempY-TV.apk
      - name: Verify private playlist is absent
        run: |
          if strings sempY-TV.apk | grep -Eq '14389bc4798d|936ec2885478a2564d1065c84f8532c5|fluxeras'; then
            echo 'Private playlist data found in APK'
            exit 1
          fi
      - name: Create update manifest
        run: |
          HASH=$(sha256sum sempY-TV.apk | cut -d ' ' -f 1)
          printf '{\n  "versionCode": 15,\n  "versionName": "1.2.1",\n  "apkUrl": "https://raw.githubusercontent.com/semperthY/sempY-TV-Updates/main/sempY-TV.apk",\n  "sha256": "%s"\n}\n' "$HASH" > latest.json
      - name: Publish files
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add sempY-TV.apk latest.json
          git commit -m "publish: sempY TV 1.2.1"
          git push
