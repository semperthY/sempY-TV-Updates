name: Publish update
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/publish.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified signed build
        run: |
          curl --fail --location 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-c2b0-8210-94cc-e6acbd4e2d33/raw?se=2026-09-16T03%3A32%3A57Z&sp=r&sv=2026-02-06&sr=b&scid=01a0a82b-cc79-7df1-bd31-4fd16390b4e6&skoid=6658dbdd-f305-4d30-8f6b-d62218202cb9&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T19%3A04%3A43Z&ske=2026-09-16T19%3A04%3A43Z&sks=b&skv=2026-02-06&sig=%2BY/FItTv4ug%2BLsZEQcbzavu9ztSsOwDRH0dA34PBJzI%3D' --output build.zip
          echo 'c93057fff68fff2b6b9c1fbd16fad8a0a160d29df4f28eafe09400c279610039  build.zip' | sha256sum --check -
          unzip -o build.zip
          mv app-release.apk sempY-TV.apk
      - name: Verify private playlist is absent
        run: |
          if strings sempY-TV.apk | grep -Eq '14389bc4798d|936ec2885478a2564d1065c84f8532c5|fluxeras'; then
            echo 'Private playlist data found in APK'
            exit 1
          fi
      - name: Create update manifest
        run: |
          HASH=$(sha256sum sempY-TV.apk | cut -d ' ' -f 1)
          printf '{\n  "versionCode": 31,\n  "versionName": "1.7.0",\n  "apkUrl": "https://raw.githubusercontent.com/semperthY/sempY-TV-Updates/main/sempY-TV.apk",\n  "sha256": "%s"\n}\n' "$HASH" > latest.json
      - name: Publish files
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add sempY-TV.apk latest.json
          git commit -m "publish: sempY TV 1.7.0"
          git push
