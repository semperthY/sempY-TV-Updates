name: Publish update
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/publish.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified signed build
        run: |
          curl --fail --location 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-ccd4-8210-a289-1f80e5ca6848/raw?se=2026-09-15T20%3A01%3A02Z&sp=r&sv=2026-02-06&sr=b&scid=dbef846e-2b7c-44cd-a27e-4d24197b0f0c&skoid=e32cbaad-a1eb-429-9f16-1b364ab43781&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T07%3A04%3A32Z&ske=2026-09-16T07%3A04%3A32Z&sks=b&skv=2026-02-06&sig=SHr6ymN0LRJCmdsZXRF%2FJMOR2RY%2FRFUh5A8HdUIOD0M%3D' --output build.zip
          echo 'cb4cba122131913fb7ef7e082b9bc345c9862fce1d45c4121a24f8dfeb6bd4ba  build.zip' | sha256sum --check -
          unzip -o build.zip
          mv app-release.apk sempY-TV.apk
      - name: Verify private playlist is absent
        run: |
          if strings sempY-TV.apk | grep -Eq '14389bc4798d|936ec2885478a2564d1065c84f8532c5|fluxeras'; then
            echo 'Private playlist data found in APK'
            exit 1
          fi
      - name: Create update manifest
        run: |
          HASH=$(sha256sum sempY-TV.apk | cut -d ' ' -f 1)
          printf '{\n  "versionCode": 28,\n  "versionName": "1.6.1",\n  "apkUrl": "https://raw.githubusercontent.com/semperthY/sempY-TV-Updates/main/sempY-TV.apk",\n  "sha256": "%s"\n}\n' "$HASH" > latest.json
      - name: Publish files
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add sempY-TV.apk latest.json
          git commit -m "publish: sempY TV 1.6.1"
          git push
