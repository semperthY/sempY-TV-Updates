name: Publish update
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/publish.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified signed build
        run: |
          curl --fail --location 'https://sdmntprukwest.oaiusercontent.com/files/00000000-eddc-8243-88b4-b66f700b2d1b/raw?se=2026-09-16T17%3A18%3A20Z&sp=r&sv=2026-02-06&sr=b&scid=01a0ab25-2b77-7554-894f-d716bcd02ce8&skoid=e32cbaad-a1eb-4299-9f16-1b364ab43781&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T19%3A07%3A01Z&ske=2026-09-16T19%3A07%3A01Z&sks=b&skv=2026-02-06&sig=AV2hPIzsYJyLIDU1CcRfTBn7jYWbPX3KcTFx2OecWUk%3D' --output build.zip
          echo '1ebb6928e231d1324e46a8f16977f2615cbda8f5e6a965e7b61b1f29771e1fc5  build.zip' | sha256sum --check -
          unzip -o build.zip
          mv app-release.apk sempY-TV.apk
      - name: Verify private playlist is absent
        run: |
          if strings sempY-TV.apk | grep -Eq '14389bc4798d|936ec2885478a2564d1065c84f8532c5|fluxeras'; then
            echo 'Private playlist data found in APK'
            exit 1
          fi
      - name: Create update manifest
        run: |
          HASH=$(sha256sum sempY-TV.apk | cut -d ' ' -f 1)
          printf '{\n  "versionCode": 34,\n  "versionName": "1.7.3",\n  "apkUrl": "https://raw.githubusercontent.com/semperthY/sempY-TV-Updates/main/sempY-TV.apk",\n  "sha256": "%s"\n}\n' "$HASH" > latest.json
      - name: Publish files
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add sempY-TV.apk latest.json
          git commit -m "publish: sempY TV 1.7.3"
          git push
