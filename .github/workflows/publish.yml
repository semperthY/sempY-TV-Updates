name: Publish update
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/publish.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified signed build
        run: |
          curl --fail --location 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-d61c-8210-8ada-984fe054dbea/raw?se=2026-09-14T17%3A45%3A16Z&sp=r&sv=2026-02-06&sr=b&scid=01a0a0f3-8152-7160-aeb9-d15367df0ae2&skoid=c30e7ce7-1f51-4051-a377-288cdba21c02&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T06%3A48%3A11Z&ske=2026-09-15T06%3A48%3A11Z&sks=b&skv=2026-02-06&sig=BQZKHNHJ0Adp5kXIT2Ltw8IBoEp9TpwgztSa%2BNm5CDM%3D' --output build.zip
          echo 'c867a37dea725d6b408d9f0c7412e814ca421876a7069966d9e1c70c7303d2eb  build.zip' | sha256sum --check -
          unzip -o build.zip
          mv app-release.apk sempY-TV.apk
      - name: Verify private playlist is absent
        run: |
          if strings sempY-TV.apk | grep -Eq '14389bc4798d|936ec2885478a2564d1065c84f8532c5|fluxeras'; then
            echo 'Private playlist data found in APK'
            exit 1
          fi
      - name: Create update manifest
        run: |
          HASH=$(sha256sum sempY-TV.apk | cut -d ' ' -f 1)
          printf '{\n  "versionCode": 14,\n  "versionName": "1.2.0",\n  "apkUrl": "https://raw.githubusercontent.com/semperthY/sempY-TV-Updates/main/sempY-TV.apk",\n  "sha256": "%s"\n}\n' "$HASH" > latest.json
      - name: Publish files
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add sempY-TV.apk latest.json
          git commit -m "publish: sempY TV 1.2.0"
          git push
