name: Publish update
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/publish.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified signed build
        run: |
          curl --fail --location 'https://sdmntprukwest.oaiusercontent.com/files/00000000-5564-8243-85cb-4d0d47b8adfa/raw?se=2026-09-15T03%3A17%3A45Z&sp=r&sv=2026-02-06&sr=b&scid=01a0a305-eb01-7085-bf24-f9d4fbe74f71&skoid=6658dbdd-f305-4d30-8f6b-d62218202cb9&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T20%3A20%3A03Z&ske=2026-09-15T20%3A20%3A03Z&sks=b&skv=2026-02-06&sig=0I/jRMl2JYtd3nI772eczCGld%2BvNhefXUw%2BGGVZgUjI%3D' --output build.zip
          echo '468c8dad1a68edce56c1b8c7a43e5b16b89b67e2811f9d7c317cbb1e2c34bb82  build.zip' | sha256sum --check -
          unzip -o build.zip
          mv app-release.apk sempY-TV.apk
      - name: Verify private playlist is absent
        run: |
          if strings sempY-TV.apk | grep -Eq '14389bc4798d|936ec2885478a2564d1065c84f8532c5|fluxeras'; then
            echo 'Private playlist data found in APK'
            exit 1
          fi
      - name: Create update manifest
        run: |
          HASH=$(sha256sum sempY-TV.apk | cut -d ' ' -f 1)
          printf '{\n  "versionCode": 16,\n  "versionName": "1.2.2",\n  "apkUrl": "https://raw.githubusercontent.com/semperthY/sempY-TV-Updates/main/sempY-TV.apk",\n  "sha256": "%s"\n}\n' "$HASH" > latest.json
      - name: Publish files
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add sempY-TV.apk latest.json
          git commit -m "publish: sempY TV 1.2.2"
          git push
