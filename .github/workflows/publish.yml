name: Publish update
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/publish.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified signed build
        run: |
          curl --fail --location 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-3d18-81f4-a8d9-a5e81212df69/raw?se=2026-09-16T18%3A27%3A57Z&sp=r&sv=2026-02-06&sr=b&scid=01a0ab66-e62c-7e42-9ec2-4dc4c42a6817&skoid=e32cbaad-a1eb-4299-9f16-1b364ab43781&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T04%3A31%3A28Z&ske=2026-09-17T04%3A31%3A28Z&sks=b&skv=2026-02-06&sig=ni1Rckyr0Xi8tsPHPcPFpQVcsZ7FYtna7COD0EuOJgs%3D' --output build.zip
          echo '959c2680145f27eb278d9959ec2340cd4c44c182b1d85e9b0855325349785457  build.zip' | sha256sum --check -
          unzip -o build.zip
          mv app-release.apk sempY-TV.apk
      - name: Verify private playlist is absent
        run: |
          if strings sempY-TV.apk | grep -Eq '14389bc4798d|936ec2885478a2564d1065c84f8532c5|fluxeras'; then
            echo 'Private playlist data found in APK'
            exit 1
          fi
      - name: Create update manifest
        run: |
          HASH=$(sha256sum sempY-TV.apk | cut -d ' ' -f 1)
          printf '{\n  "versionCode": 35,\n  "versionName": "1.7.4",\n  "apkUrl": "https://raw.githubusercontent.com/semperthY/sempY-TV-Updates/main/sempY-TV.apk",\n  "sha256": "%s"\n}\n' "$HASH" > latest.json
      - name: Publish files
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add sempY-TV.apk latest.json
          git commit -m "publish: sempY TV 1.7.4"
          git push
