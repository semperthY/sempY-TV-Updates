name: Publish update
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/publish.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified signed build
        run: |
          curl --fail --location 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-0d2c-81f4-80d2-245df9e9c52b/raw?se=2026-09-15T20%3A20%3A15Z&sp=r&sv=2026-02-06&sr=b&scid=23856aca-5edb-4fda-9b6f-3f69cfa18357&skoid=e32cbaad-a1eb-4299-9f16-1b364ab43781&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T19%3A13%3A36Z&ske=2026-09-16T19%3A13%3A36Z&sks=b&skv=2026-02-06&sig=6SK9vtKx5iNSgKkS5Tn%2BQsfRee2eGM4yhzzQ4jdGJ3c%3D' --output build.zip
          echo '014aa4ea503b561c48c7d24178cb3767f25d695453b2288c26a2e76874a0aa06  build.zip' | sha256sum --check -
          unzip -o build.zip
          mv app-release.apk sempY-TV.apk
      - name: Verify private playlist is absent
        run: |
          if strings sempY-TV.apk | grep -Eq '14389bc4798d|936ec2885478a2564d1065c84f8532c5|fluxeras'; then
            echo 'Private playlist data found in APK'
            exit 1
          fi
      - name: Create update manifest
        run: |
          HASH=$(sha256sum sempY-TV.apk | cut -d ' ' -f 1)
          printf '{\n  "versionCode": 29,\n  "versionName": "1.6.2",\n  "apkUrl": "https://raw.githubusercontent.com/semperthY/sempY-TV-Updates/main/sempY-TV.apk",\n  "sha256": "%s"\n}\n' "$HASH" > latest.json
      - name: Publish files
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add sempY-TV.apk latest.json
          git commit -m "publish: sempY TV 1.6.2"
          git push
