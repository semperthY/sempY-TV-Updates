name: Publish update
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/publish.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified signed build
        run: |
          curl --fail --location 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-7f8c-81f4-83ce-15cb2513dd9d/raw?se=2026-09-15T17%3A36%3A03Z&sp=r&sv=2026-02-06&sr=b&scid=01a0a618-8643-7838-8936-f0f5fe67e964&skoid=e32cbaad-a1eb-4299-9f16-1b364ab43781&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T08%3A28%3A39Z&ske=2026-09-16T08%3A28%3A39Z&sks=b&skv=2026-02-06&sig=Fk7r31ZnIrfBp2rzdONCv7dxF0uZypbmI/qhwosraWU%3D' --output build.zip
          echo 'cb33b19846e5e13cf2ad6ab6f04a0e25d8024171675bab11a3be9a079e08ca39  build.zip' | sha256sum --check -
          unzip -o build.zip
          mv app-release.apk sempY-TV.apk
      - name: Verify private playlist is absent
        run: |
          if strings sempY-TV.apk | grep -Eq '14389bc4798d|936ec2885478a2564d1065c84f8532c5|fluxeras'; then
            echo 'Private playlist data found in APK'
            exit 1
          fi
      - name: Create update manifest
        run: |
          HASH=$(sha256sum sempY-TV.apk | cut -d ' ' -f 1)
          printf '{\n  "versionCode": 22,\n  "versionName": "1.4.2",\n  "apkUrl": "https://raw.githubusercontent.com/semperthY/sempY-TV-Updates/main/sempY-TV.apk",\n  "sha256": "%s"\n}\n' "$HASH" > latest.json
      - name: Publish files
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add sempY-TV.apk latest.json
          git commit -m "publish: sempY TV 1.4.3"
          git push
