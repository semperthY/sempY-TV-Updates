name: Publish update
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/publish.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified signed build
        run: |
          curl --fail --location 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-2430-81f4-adc2-bc4daff6f45a/raw?se=2026-09-15T17%3A55%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=01a0a627-929f-7c56-a1d6-d318b5a6ab06&skoid=e32cbaad-a1eb-4299-9f16-1b364ab43781&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T04%3A42%3A34Z&ske=2026-09-16T04%3A42%3A34Z&sks=b&skv=2026-02-06&sig=C5Kkmwph1cW9vQbVF90KQGg62ybvPNzmzPLprkEubDA%3D' --output build.zip
          echo '9ea1bc2c336feab4a92a496b1d18613c5cf652613eface33e2482c0950059333  build.zip' | sha256sum --check -
          unzip -o build.zip
          mv app-release.apk sempY-TV.apk
      - name: Verify private playlist is absent
        run: |
          if strings sempY-TV.apk | grep -Eq '14389bc4798d|936ec2885478a2564d1065c84f8532c5|fluxeras'; then
            echo 'Private playlist data found in APK'
            exit 1
          fi
      - name: Create update manifest
        run: |
          HASH=$(sha256sum sempY-TV.apk | cut -d ' ' -f 1)
          printf '{\n  "versionCode": 24,\n  "versionName": "1.4.4",\n  "apkUrl": "https://raw.githubusercontent.com/semperthY/sempY-TV-Updates/main/sempY-TV.apk",\n  "sha256": "%s"\n}\n' "$HASH" > latest.json
      - name: Publish files
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add sempY-TV.apk latest.json
          git commit -m "publish: sempY TV 1.4.4"
          git push
